name: CI

# Runs on every push and pull request. Deliberately does NOT run the full
# simulation suite: that takes ~30 minutes and belongs on a release, not on every
# commit. What it does check is the class of failure that has actually reached
# reviewers of this project -- stale datasets, prose that disagrees with the data,
# and a manuscript that cites artefacts it was not built from.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest d2ro/tests/ -q

      # The browser demo executes a snapshot of d2ro/ embedded in
      # docs/python_bundle.js. Nothing about editing the package refreshes it, so
      # without this the published demo drifts away from the code the paper
      # describes, silently and indefinitely.
      - name: Web demo bundle must match the Python sources
        run: python scripts/check_web_bundle.py

  provenance:
    name: Data provenance and manuscript claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Recomputes statistics from the committed CSVs. This fails if any dataset
      # is missing, short, or was generated by code that no longer matches the
      # tree -- the exact condition that let superseded numbers survive a
      # "regeneration" in an earlier round.
      - name: Recompute statistics
        run: python paper/scripts/analyze_results.py

      - name: Every dataset must report ok
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("experiments/data/analysis_results.json"))
          bad = {k: v.get("status") for k, v in r.items()
                 if isinstance(v, dict) and v.get("status") != "ok"}
          if bad:
              print("Datasets not ok:", bad)
              sys.exit(1)
          print(f"all {len(r)} datasets ok")
          PY

      # Generated tables cannot drift, but prose can: a number quoted in a
      # paragraph survives a regeneration that changes it.
      - name: Manuscript prose must match the data
        run: python paper/scripts/verify_manuscript_claims.py

  references:
    name: Bibliography audit
    runs-on: ubuntu-latest
    continue-on-error: true   # Crossref is a third party; a flake must not block
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every reference against Crossref
        run: python paper/scripts/audit_references.py || true

  paper:
    name: Build the manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-publishers texlive-science poppler-utils

      - name: Regenerate tables and figures
        run: |
          python paper/scripts/analyze_results.py
          python paper/scripts/generate_tables_and_figures.py

      - name: Compile
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode paper.tex
          bibtex paper || true
          pdflatex -interaction=nonstopmode paper.tex
          pdflatex -interaction=nonstopmode paper.tex

      # A PDF containing "Table ??" was submitted to a journal in an earlier round.
      # It is trivially detectable, so it is now a hard failure.
      - name: Reject unresolved references
        working-directory: paper
        run: |
          if grep -qE "Warning: (Reference|Citation) \`" paper.log; then
            echo "::error::Unresolved reference or citation in paper.log"
            grep -E "Warning: (Reference|Citation) \`" paper.log
            exit 1
          fi
          if pdftotext paper.pdf - | grep -qE "(Table|Fig\.?|Section|Eq\.?) *\?\?"; then
            echo "::error::Unresolved '??' present in the compiled PDF"
            exit 1
          fi
          echo "no unresolved references"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
